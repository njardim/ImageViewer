name: dependency update

# D-62: give an issue the "auto update" label (or run this workflow by hand) to check every
# pinned dependency against its upstream releases (scripts/update_dependencies.py: overlay
# ports, the vcpkg baseline, Qt). When any is behind, it opens a pull request that moves them and
# starts the full build (build.yml: three systems, every test, the packages) on it, and links
# both from the issue; when everything is current, it says so and closes the issue. Merging and
# publishing a release stay with a person.
#
# D-67: a release is taken only once it is as old as the cooldown, packaging/cooldown-days.txt
# (15 days; the owner lowers it on main to take the latest releases sooner, 0 for every latest
# one, and sets it back afterwards); a security fix that cannot wait is the exception, marked for
# review and recorded in packaging/cooldown-exceptions.txt, which the same run clears of exceptions
# whose release is past the cooldown (D-73). A release archive is taken only when it matches its
# tag, and the pull request lists what changed upstream for a person to read; the full audit of
# the updated pins goes in its description, and a pull request whose audit fails is a draft.
#
# Labels need triage access, so only collaborators start it. Nothing from the issue (title,
# body, comments) reaches a shell. Repository setting needed once: Settings > Actions > General
# > "Allow GitHub Actions to create and approve pull requests".
on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'auto update'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write      # the update branch
      pull-requests: write # its pull request
      issues: write        # the report on the issue
      actions: write       # start build.yml (a push or a PR made with this token starts no workflow)
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Mercurial (GraphicsMagick's repository)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mercurial > /dev/null

      - name: Check the dependencies against upstream
        id: check
        run: python3 scripts/update_dependencies.py --apply --report "$RUNNER_TEMP/report.md"

      - name: Audit the updated pins
        id: audit
        if: steps.check.outputs.changed == 'true'
        run: |
          status=0
          python3 scripts/audit_dependencies.py --vulnerabilities --sources --cooldown \
            --report "$RUNNER_TEMP/audit.md" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Pull request and full build
        if: steps.check.outputs.changed == 'true'
        env:
          AUDIT: ${{ steps.audit.outputs.status }}
          EXCEPTION: ${{ steps.check.outputs.exception }}
          DAYS: ${{ steps.check.outputs.cooldown_days }}
        run: |
          branch="deps/update-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          # DCO sign-off (CONTRIBUTING.md), as for every contribution.
          git commit -s -q -m "Dependencies: move to the latest stable releases (D-62)" \
            -m "Made by the dependency update workflow; the pull request lists each change."
          git push -q origin "$branch"
          draft=()
          {
            if [ "$EXCEPTION" = true ]; then
              echo "> **Security exception (D-67)**: a release younger than the $DAYS-day cooldown is taken because it fixes a known vulnerability. Read its upstream changes (below) before merging."
              echo
            fi
            if [ "$DAYS" -lt 15 ]; then
              echo "> **Cooldown lowered to $DAYS days** (packaging/cooldown-days.txt): releases younger than 15 days are taken. Set it back to 15 once the release that needed it is out."
              echo
            fi
            if [ "$AUDIT" != 0 ]; then
              echo "> **The supply-chain audit of these pins fails** (below): a draft until a person resolves it."
              echo
            fi
            echo "Made by the dependency update workflow (D-62, D-67) from the stable releases upstream."
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "## Supply-chain audit of the updated pins"
            echo
            cat "$RUNNER_TEMP/audit.md"
            echo
            echo "The full build runs on this branch (see the checks). Before merging: green on the three systems, the audit clean, the upstream changes above read, and the notes resolved."
            if [ -n "$ISSUE" ]; then echo; echo "Closes #$ISSUE"; fi
          } > "$RUNNER_TEMP/body.md"
          [ "$AUDIT" != 0 ] && draft=(--draft)
          url="$(gh pr create --base main --head "$branch" "${draft[@]}" \
            --title "Dependencies: latest stable releases" --body-file "$RUNNER_TEMP/body.md")"
          gh workflow run build.yml --ref "$branch"
          if [ -n "$ISSUE" ]; then
            { echo "Updates found: $url (the full build runs on it)."; echo; cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          fi

      - name: Nothing to update
        if: steps.check.outputs.changed != 'true' && env.ISSUE != ''
        env:
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          # A check that could not reach its upstream leaves the issue open, to try again.
          if [ "$FAILED" = true ]; then
            summary="No update found, but some checks failed (see the notes): the issue stays open; remove and add the label again to retry."
          else
            summary="Every dependency is at its latest stable release; nothing to build."
          fi
          { echo "$summary"; echo; cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$FAILED" != true ]; then
            gh issue close "$ISSUE" --reason completed
          fi
